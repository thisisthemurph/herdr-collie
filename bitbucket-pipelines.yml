# CI for Herdr Collie: `make check` on every push and pull request.
# Packages come from public npm (bunfig.toml), so no registry credentials are needed.
image: oven/bun:1.4.4

definitions:
  steps:
    - step: &check
        name: make check
        caches:
          - bun
        script:
          - apt-get update -qq && apt-get install -y -qq make git > /dev/null
          - bun install --frozen-lockfile
          - make check
  caches:
    bun: ~/.bun/install/cache

pipelines:
  default:
    - step: *check
  pull-requests:
    "**":
      - step: *check
